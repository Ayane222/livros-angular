<main class="container mt-4">
  <h1>Dados do Livro</h1>
  <form (submit)="incluir()" ngNativeValidate class="mt-3">
    <div class="mb-3">
      <label for="titulo" class="form-label">Título</label>
      <input type="text" id="titulo" class="form-control" [(ngModel)]="livro.titulo" name="titulo" required>
    </div>

    <div class="mb-3">
      <label for="resumo" class="form-label">Resumo</label>
      <textarea id="resumo" class="form-control" rows="3" [(ngModel)]="livro.resumo" name="resumo" required></textarea>
    </div>

    <div class="mb-3">
      <label for="editora" class="form-label">Editora</label>
      <select id="editora" class="form-select" [(ngModel)]="livro.codEditora" name="codEditora" required>
        <option *ngFor="let ed of editoras" [value]="ed.codEditora">{{ ed.nome }}</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="autores" class="form-label">Autores (1 por linha)</label>
      <textarea id="autores" class="form-control" rows="3" [(ngModel)]="autoresForm" name="autoresForm" required></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Salvar Dados</button>
  </form>
</main>
