<main class="container mt-4">
  <h1 class="mb-4">Catálogo de Livros</h1>
  <table class="table table-striped table-hover mt-3">
    <thead class="table-dark">
      <tr>
        <th style="width: 25%;">Título</th>
        <th style="width: 45%;">Resumo</th>
        <th style="width: 15%;">Editora</th>
        <th style="width: 15%;">Autores</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let livro of livros">
        <td>
          <div class="fw-bold">{{ livro.titulo }}</div>
          <button class="btn btn-danger btn-sm mt-2" (click)="excluir(livro.codigo)">Excluir</button>
        </td>
        <td>{{ livro.resumo }}</td>
        <td>{{ obterNome(livro.codEditora) }}</td>
        <td>
          <ul class="mb-0">
            <li *ngFor="let autor of livro.autores">{{ autor }}</li>
          </ul>
        </td>
      </tr>
    </tbody>
  </table>
</main>
